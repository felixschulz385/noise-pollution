# Conda environment for the noise-pollution project.
#
# Provenance:
#   - Hand-assembled on 2026-09-09 from the third-party imports found in src/
#     (macOS / darwin, project developed against Python 3.12). It is NOT a
#     `conda list --explicit` dump of any specific machine.
#   - Verified to run the pytest suite under tests/ (see .github/workflows/tests.yml).
#   - NOT a byte-exact record of any HPC/production environment. Before trusting
#     it for a cluster run, reconcile it against that environment's own
#     `conda list --explicit` output.
#
# environment.yml is the single dependency source of truth. Add packages here,
# not to pyproject.toml or a requirements.txt.

name: noise-pollution
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pandas
  - geopandas
  - shapely
  - pyogrio
  - matplotlib
  - contextily       # web-tile basemaps for the exploratory notebooks
  - pyarrow          # timetable preprocess writes .parquet
  - xlrd>=2.0.1      # read the legacy .xls FLDOE assessment workbooks
  - lxml             # pd.read_html parser for "Excel HTML" .xls exports (2004-05 science reports)
  - pytest
  - pip
  - pip:
      - -e .
