# The dependency input: edit this file, then regenerate the lock in the same commit:
#   conda-lock lock -f environment.yml -p osx-64 -p linux-64
# CI and new machines install from conda-lock.yml (docs/repository/environment.md in the
# template). Assembled from the third-party imports in src/; the analysis notebooks also need
# Stata (csdid, drdid, reghdfe) through its own pystata, which conda does not provide.
name: noise_pollution
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - ruff
  - conda-lock
  - ipykernel
  - nbconvert
  - numpy
  - pandas
  - pyyaml
  - geopandas
  - shapely
  - pyogrio
  - pyarrow          # parquet throughout
  - matplotlib
  - contextily       # web-tile basemaps in the data notebooks
  - xlrd>=2.0.1      # the legacy .xls FLDOE assessment workbooks
  - openpyxl         # the .xlsx FLDOE staff workbooks
  - lxml             # pd.read_html for "Excel HTML" .xls exports (2004-05 science reports)
  - pip:
      - -e .
