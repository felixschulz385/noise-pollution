# Florida region configuration.
#
# PLACEHOLDER. Today the pipeline reads its settings from argparse defaults in
# src/regions/florida/cli.py and src/regions/florida/sources/, not from this
# file. When the per-region source-registry work lands (see
# docs/design/00-overview.md and docs/design/01-multi-region-layout.md), every
# source should read its defaults from here via `--config`, and per-flag
# defaults become overrides only.
#
# Sources wired up so far:
#   - noise_barriers: FDOT inventory via FGDL (list-versions, fetch, preprocess)
#   - assessments:    FLDOE annual school results (list-years, fetch — manual
#                     download; www.fldoe.org blocks scripted clients — preprocess)
#   - schools:        school spine (fetch) — MSID (eds.fldoe.org ColdFusion app,
#                     absorbs the former master_file source) + NCES EDGE geocode
#                     + Urban Institute Education Data API (CCD / CRDC / EDFacts)

region: florida
data_root: data/florida
